[package]
name = "reel-store"
version.workspace = true
edition.workspace = true
description = "The node's store: tapedrive's columns on the reel engine"

[dependencies]
store.workspace = true
store-rocks = { workspace = true, optional = true }
tape-store.workspace = true
reel.workspace = true
reel-core.workspace = true
serde.workspace = true
tracing = "0.1"

[features]
# The RocksDB arm the reel is measured against, which only a bench opens.
# A node that wants RocksDB builds tape-node with its own `rocks` feature and
# never touches this one. Tests opt in with
# `cargo test -p reel-store --features rocks`.
rocks = ["dep:store-rocks", "tape-store/rocks"]

[dev-dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
tape-core.workspace = true
tape-crypto.workspace = true
tempfile = "3.10"
libc = "0.2"
# The downgrade to posix is announced and nowhere else recorded, so a test
# that wants the outcome has to listen for it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
