[package]
name = "tape-store"
version.workspace = true
edition.workspace = true
description = "Application-specific storage layer for distributed tape storage nodes"

[dependencies]
tape-api = { workspace = true, features = ["wincode"] }
tape-core = { workspace = true, features = ["wincode"] }
tape-crypto = { workspace = true, features = ["wincode"] }
store.workspace = true
store-memory.workspace = true
store-rocks = { workspace = true, optional = true }
rocksdb = { workspace = true, optional = true }
wincode = "0.1"
wincode-derive = "0.1"
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytemuck.workspace = true
reel-bridge = { workspace = true, features = ["rocks"] }
store-rocks.workspace = true
tempfile = "3.10"
# The rocks arm is a bench control, so the benches ask for it and nothing else does.
tape-store = { path = ".", features = ["rocks"] }

[features]
# RocksDB constructors, for the bench arm the reel is measured against
rocks = ["dep:store-rocks", "dep:rocksdb"]
