[package]
name = "tape-store"
version.workspace = true
edition.workspace = true
description = "Application-specific storage layer for distributed tape storage nodes"

[[example]]
name = "atomic_operations"
required-features = ["rocks"]

[[example]]
name = "basic_usage"
required-features = ["rocks"]

[[example]]
name = "read_replica"
required-features = ["rocks"]

[dependencies]
tape-core = { workspace = true, features = ["wincode"] }
tape-crypto = { workspace = true, features = ["wincode"] }
tape-store-api.workspace = true
tape-store-memory.workspace = true
tape-store-rocks = { workspace = true, optional = true }
rocksdb = { workspace = true, optional = true }
wincode = "0.1"
wincode-derive = "0.1"
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytemuck.workspace = true
tape-store-reel.workspace = true
tempfile = "3.10"
# The durable enqueue op is awaited, so its tests need a runtime.
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# RocksDB constructors and comparison tests. Opt in explicitly with
# `cargo test -p tape-store --features rocks`.
rocks = ["dep:tape-store-rocks", "dep:rocksdb", "tape-store-reel/rocks"]
