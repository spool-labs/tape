[package]
name = "tape-store"
version.workspace = true
edition.workspace = true
description = "Application-specific storage layer for distributed tape storage nodes"

[[example]]
name = "atomic_operations"
required-features = ["rocks"]

[[example]]
name = "basic_usage"
required-features = ["rocks"]

[[example]]
name = "read_replica"
required-features = ["rocks"]

[dependencies]
tape-api = { workspace = true, features = ["wincode"] }
tape-core = { workspace = true, features = ["wincode"] }
tape-crypto = { workspace = true, features = ["wincode"] }
store.workspace = true
store-memory.workspace = true
store-rocks = { workspace = true, optional = true }
rocksdb = { workspace = true, optional = true }
wincode = "0.1"
wincode-derive = "0.1"
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytemuck.workspace = true
reel-store.workspace = true
tempfile = "3.10"

[features]
# RocksDB constructors and comparison tests. Opt in explicitly with
# `cargo test -p tape-store --features rocks`.
rocks = ["dep:store-rocks", "dep:rocksdb", "reel-store/rocks"]
