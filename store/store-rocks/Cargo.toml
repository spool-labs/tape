[package]
name = "store-rocks"
version = "0.4.0"
edition = "2021"
description = "RocksDB backend implementation for the store crate"

[features]
default = []
metrics = ["tape-metrics/metrics", "store/metrics"]

[dependencies]
store = { path = "../store" }
tape-metrics = { version = "0.4.0", path = "../../lib/metrics", optional = true }
rocksdb = { version = "0.23.0", features = ["multi-threaded-cf"] }
thiserror = "2.0.12"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.10"
