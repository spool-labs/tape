[package]
name = "tape-store-rocks"
version = "0.4.8"
edition = "2021"
description = "RocksDB backend implementation for the store crate"

[features]
default = []
metrics = ["tape-metrics/metrics", "tape-store-api/metrics"]

[dependencies]
tape-store-api = { path = "../store-api" }
tape-metrics = { version = "0.4.8", path = "../../lib/metrics", optional = true }
rocksdb = { version = "0.23.0", features = ["multi-threaded-cf"] }
thiserror = "2.0.12"
fs2 = "0.4"
# An awaited write runs on the runtime's blocking pool.
tokio = { version = "1.37", features = ["rt"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.37", features = ["macros", "rt"] }
