[package]
name = "whirlwind"
version.workspace = true
edition.workspace = true
description = "Whirlwind storage challenge mechanism: model, probes, and latency simulation"

[[bin]]
name = "whirlwind"
path = "src/bin/whirlwind.rs"

[[bin]]
name = "whirlwind-sim"
path = "src/bin/simulations/main.rs"
required-features = ["simulations"]

[dependencies]
# Internal
tape-core = { workspace = true }
tape-crypto = { workspace = true }
tape-slicer = { workspace = true }

# External
clap = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }

# Simulation and plotting (feature-gated, keeps the library build lean)
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "ttf",
    "all_elements",
    "all_series",
    "histogram",
    "line_series",
], optional = true }
csv = { version = "1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Real-latency simulation inputs (ping dataset, stake distribution) and the
# simulation binary. Pulls in csv and serde for parsing the dataset, and
# plotters for rendering the latency histogram.
simulations = ["dep:plotters", "dep:csv", "dep:serde", "dep:serde_json"]

[lints.clippy]
# panic hygiene
dbg_macro = "warn"
todo = "warn"
# perf
redundant_clone = "warn"
or_fun_call = "warn"
