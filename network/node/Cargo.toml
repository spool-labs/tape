[package]
name = "tape-node"
version.workspace = true
edition.workspace = true
description = "Tapedrive storage node runtime (v2)"

[[bin]]
name = "tape-node"
path = "src/bin/node/main.rs"

[dependencies]
tape-blacklist = { workspace = true }
tape-forwarded = { workspace = true }
# Workspace crates
tape-api = { workspace = true, features = ["wincode"] }
tape-core = { workspace = true, features = ["wincode"] }
tape-crypto = { workspace = true, features = ["wincode"] }
tape-sdk = { workspace = true }
tape-store = { workspace = true }
tape-blocks = { workspace = true }
tape-spooler = { workspace = true }
tape-store-api = { workspace = true }
tape-store-rocks = { workspace = true, optional = true }
reel = { workspace = true }
tape-store-reel = { workspace = true }
tape-protocol = { workspace = true }
tape-peer-manager = { workspace = true }
tape-peer-http = { workspace = true }
tape-peer-tls = { workspace = true }
tape-rpc = { workspace = true }
tape-rpc-client = { workspace = true }
tape-rpc-solana = { workspace = true }
tape-retry = { workspace = true }
tape-metrics = { workspace = true, optional = true }
tape-observe-api = { workspace = true }
memory-stats = { version = "1", optional = true }

# External
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
dirs = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { workspace = true }
x509-parser = "0.16"
tower = { version = "0.5", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
bytemuck = { workspace = true }
tape-slicer = { workspace = true }
tape-snapshot = { workspace = true }
base64 = { workspace = true }
wincode = { workspace = true }
lz4_flex = { workspace = true }
rlimit = "0.10"
rand = { workspace = true }
rand_chacha = "0.3"
hex = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
# Force vendored openssl so zigbuild doesn't need a system libssl for the
# x86_64-linux cross-compile. Indirect dep via solana-rpc-client → reqwest
# with native-tls; vendored=1 builds libssl from source via openssl-src.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
rpc-litesvm = { workspace = true }
peer-memory = { workspace = true }
tape-store-memory = { workspace = true }
tape-chain-harness = { workspace = true }

[features]
default = []

# Serve the node's store on RocksDB rather than the reel. A build-time choice,
# since the node is generic over its store and picking at runtime would carry
# both engines in every binary.
rocks = ["dep:tape-store-rocks", "tape-store/rocks"]

metrics = [
    "tape-metrics/metrics",
    "dep:memory-stats",
    "tape-rpc-client/metrics",
    "tape-store-api/metrics",
    "tape-store-reel/metrics",
]
